name: Desktop release

# Builds cot.app (Tauri) for Apple Silicon and attaches the DMG and updater
# artifacts to the tag's GitHub Release, created as a draft when missing.
# release.yml calls this after CI passes, publishes the release once every
# build is in, and then opens the site PR (see release.yml).
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  updater signing (required)
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  optional cot.run binary mirror
# Variables:
#   R2_ACCOUNT_ID, R2_BUCKET optional mirror (skipped when unset)

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      signature:
        value: ${{ jobs.build.outputs.signature }}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
      signature: ${{ steps.artifacts.outputs.signature }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/app/__init__.py)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match backend/app/__init__.py (${version})" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build cot.app
        env:
          COT_PYTHON: python
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: desktop/scripts/build.sh --release

      - name: Verify bundle
        run: desktop/scripts/verify-bundle.sh

      - name: Collect artifacts
        id: artifacts
        run: |
          bundle=desktop/src-tauri/target/release/bundle
          mkdir -p out
          cp "${bundle}"/dmg/*.dmg "out/cot_${{ steps.version.outputs.version }}_aarch64.dmg"
          cp "${bundle}/macos/cot.app.tar.gz" "${bundle}/macos/cot.app.tar.gz.sig" out/
          echo "signature=$(cat out/cot.app.tar.gz.sig)" >> "${GITHUB_OUTPUT}"
          ls -la out

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          # A draft until release.yml publishes it; a re-run reuses it.
          gh release view "${TAG}" >/dev/null 2>&1 \
            || gh release create "${TAG}" --draft --verify-tag --title "${TAG}" --generate-notes
          gh release upload "${TAG}" out/* --clobber

      - name: Mirror to R2
        if: vars.R2_BUCKET != ''
        # A backup copy only: a failed mirror must not hold the release as a draft.
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects some of the CLI's default checksum headers.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp out/ "s3://${{ vars.R2_BUCKET }}/desktop/v${{ steps.version.outputs.version }}/" \
            --recursive --endpoint-url "https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
