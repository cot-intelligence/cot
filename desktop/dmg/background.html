<!doctype html>
<!-- DMG window background in Signal Forest (src/forest.css): paper ground,
     forest-green accents, Geist Mono labels, the Newsreader wordmark. Flat
     only: no gradients or glows. Rendered to background.png by
     scripts/make-dmg-background.sh. The window is 660x400; Finder draws the
     app icon at (170,200) and Applications at (490,200) (tauri.conf.json
     bundle.macOS.dmg) with dark labels below, so the artwork leaves those clear. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,700&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 660px; height: 400px; overflow: hidden; }
  body {
    position: relative; background: #f5f6f3; color: rgb(12 26 20);
    font-family: "Geist Mono", ui-monospace, monospace; -webkit-font-smoothing: antialiased;
  }
  /* Hairline instrument grid, drawn as SVG so it stays flat. */
  .grid { position: absolute; inset: 0; }
  header { position: absolute; top: 36px; left: 0; right: 0; text-align: center; }
  .eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgb(12 26 20 / 0.4);
  }
  .wordmark {
    font-family: "Newsreader", serif; font-style: italic; font-weight: 700;
    font-size: 42px; line-height: 1; letter-spacing: -0.02em; margin-top: 10px;
  }
  .wordmark i { color: #0f5b3e; font-style: inherit; }
  /* Instrument markers: small forest crosshairs on grid intersections */
  .mark { position: absolute; width: 9px; height: 9px; transform: translate(-50%, -50%); opacity: 0.5; }
  .mark::before, .mark::after { content: ""; position: absolute; background: #0f5b3e; }
  .mark::before { left: 4px; top: 0; width: 1px; height: 9px; }
  .mark::after { top: 4px; left: 0; width: 9px; height: 1px; }
  .arrow { position: absolute; left: 262px; top: 188px; width: 136px; height: 24px; }
  footer {
    position: absolute; bottom: 28px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: 0.04em; color: rgb(12 26 20 / 0.5);
  }
  footer b { color: rgb(12 26 20 / 0.85); font-weight: 600; }
</style>
</head>
<body>
  <svg class="grid" width="660" height="400" aria-hidden="true">
    <defs>
      <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse" x="-1" y="-1">
        <path d="M32 0H0V32" fill="none" stroke="rgb(12 26 20)" stroke-opacity="0.045" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="660" height="400" fill="url(#g)"/>
  </svg>
  <header>
    <div class="eyebrow">Agent observability</div>
    <div class="wordmark">cot<i>.</i></div>
  </header>
  <!-- On 32px grid intersections (grid is offset by -1px), clear of the icons. -->
  <i class="mark" style="left:63px;top:63px"></i>
  <i class="mark" style="left:607px;top:95px"></i>
  <i class="mark" style="left:31px;top:319px"></i>
  <i class="mark" style="left:639px;top:351px;opacity:0.3"></i>
  <svg class="arrow" viewBox="0 0 136 24" fill="none" aria-hidden="true">
    <line x1="4" y1="12" x2="124" y2="12" stroke="#0f5b3e" stroke-width="1.5" stroke-dasharray="4 5" stroke-linecap="round"/>
    <path d="M118 5 L128 12 L118 19" stroke="#0f5b3e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <footer>Drag <b>cot</b> into <b>Applications</b></footer>
</body>
</html>
